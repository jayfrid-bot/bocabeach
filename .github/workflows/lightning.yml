name: GLM Lightning Feed

# Builds a small lightning.json from NOAA GOES-19 GLM and publishes it to the
# `lightning-data` branch (NOT main), so the heavy netCDF processing runs here
# on free public-repo Actions minutes and never touches the Netlify build/bill.
# The web app reads the published file via raw.githubusercontent.com.
#
# GitHub's cron is best-effort and fires this sporadically (often hours apart),
# which is too sparse for a near-real-time safety feature. So each run does NOT
# refresh once and exit — it stays awake and republishes every ~1 min for ~5.5h
# (GLM publishes 20-second granules, so this is about as live as the source gets).
# When that shift ends, the `handoff` job dispatches the next loop right away —
# the cron alone did NOT reliably overlap the loops (2026-09-28: a 109-min gap
# with stale lightning data). No external services or tokens either way.

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub fires this sporadically; the loop bridges the gaps
  push:
    branches: [main] # also (re)start the loop on every deploy, so it self-bootstraps
    paths: [".github/workflows/lightning.yml", "scripts/glm_lightning.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: glm-lightning
  cancel-in-progress: true # a new firing restarts a fresh loop (only one ever runs)

jobs:
  build-feed:
    outputs:
      started: ${{ steps.t0.outputs.started }}
    runs-on: ubuntu-latest
    timeout-minutes: 345 # ~5h45m (GitHub's hard cap is 6h)
    steps:
      - id: t0
        name: Note when this loop started (the handoff job's fast-exit guard)
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout (for the script)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet --disable-pip-version-check h5py numpy

      - name: Refresh + publish on a ~1-minute loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_OUT: ${{ runner.temp }}/lightning.json
        run: |
          set +e # one bad cycle (e.g. an S3 hiccup) must not kill the loop
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="${RUNNER_TEMP}/pub"
          deadline=$(( $(date +%s) + 19800 )) # ~5.5 hours, then the handoff job starts the next loop

          publish() {
            rm -rf "$work"; mkdir -p "$work"
            cp "${GLM_OUT}" "$work/lightning.json" || return 1
            cd "$work" || return 1
            git init -q
            git config user.name "glm-lightning-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -q -b lightning-data
            git add lightning.json
            git commit -q -m "GLM lightning feed $(date -u +%FT%TZ)"
            # Force-push a single-commit orphan branch so history never grows.
            git push -f "$remote" lightning-data
            cd - >/dev/null
          }

          while [ "$(date +%s)" -lt "$deadline" ]; do
            start=$(date +%s)
            if python scripts/glm_lightning.py; then
              # Publishes the live lightning feed for the in-app display + score cap.
              # (No push trigger here — safety push alerts are paused; see notify.ts.)
              publish && echo "published $(date -u +%FT%TZ)"
            else
              echo "cycle failed; will retry next interval"
            fi
            rem=$(( 60 - ($(date +%s) - start) )) # pace to ~1-min cycles (near-real-time)
            [ "$rem" -lt 5 ] && rem=5
            sleep "$rem"
          done

  # Starts the next loop the moment this one ends. GitHub's cron is best-effort:
  # Sep 24-28 2026 it left loops unrestarted for hours (lightning 109 min,
  # goes-cloud and the cam feed 4-5 h late every morning), so each loop relays
  # to its own successor. GITHUB_TOKEN may trigger workflow_dispatch (the one
  # event it is allowed to start), so this needs no secret. `actions: write`
  # lives on this small job only, never on the job that runs the feed scripts.
  # The cron above stays as the fallback if a run dies before reaching here.
  #  - Not after a cancel: with cancel-in-progress, a cancelled loop was
  #    already replaced by a newer run; dispatching again would ping-pong.
  #  - Not after a loop that ended within 15 min (setup broke, or a logic
  #    bug): no tight respawn cycle; the cron retries that instead.
  #  - Only from main, so a branch test run never starts a chain.
  handoff:
    needs: build-feed
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next loop
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build-feed.result }}
          STARTED: ${{ needs.build-feed.outputs.started }}
        run: |
          if [ -z "$STARTED" ]; then
            echo "build-feed never recorded its start ('${RESULT}') — not respawning; the cron retries it"
            exit 0
          fi
          ran=$(( $(date +%s) - STARTED ))
          if [ "$ran" -lt 900 ]; then
            echo "build-feed ended '${RESULT}' after only ${ran}s — not a normal shift end, so no respawn; the cron retries it"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run lightning.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "next loop dispatched (build-feed ended '${RESULT}' after ${ran}s)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not dispatch the next loop — the cron is the only fallback now"
          exit 1
