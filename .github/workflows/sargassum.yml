name: Cam Vision Feed

# Reads seaweed (sargassum) + crowd from the beach cams with Gemini vision and
# publishes ONE cam_seaweed.<slug>.json PER BEACH — driven by
# config/vision-cams.json, see scripts/cam_seaweed.py — to the `sargassum-data`
# branch (NOT main), so the AI calls run here on free public-repo Actions and
# never touch Netlify. Also keeps publishing the pre-split cam_seaweed.json as
# a copy of boca-raton's file for one release (transition fallback).
# Also, at most once per hour during daylight, grabs a frame from the Deerfield
# underwater sea-cam (yt-dlp -> ffmpeg) for a separate visibility read that
# ground-truths the surface water-clarity grades (fully fail-soft — see script).
#
# GitHub's cron is a promise of "no more often than", NOT "will fire on time":
# in practice this */10 schedule gets throttled to only ~4-5 REAL fires/day at
# unpredictable hours (verified Aug 26-28 2026: fires landed at 20:18, 23:40,
# 05:04, 20:02, 04:20 UTC — nothing else, on a schedule meant to fire ~84x/day).
# One read-and-exit per fire left the cam-vision feed hours-to-days stale,
# tripping the app's staleness gates and showing day-old summaries. So — same
# fix already proven by lightning.yml, see that file — each fire does NOT read
# once and exit. It loops INSIDE the job on its own ~10-minute wall-clock
# cadence (reading only in daylight, idling overnight) for up to ~340 min of
# job time, then the `handoff` job dispatches the next loop. The cron alone
# never kept the loops going: Sep 24-28 2026 the first morning read landed
# 4-5 h late, so the handoff (not the cron) is what keeps the feed live.
#
# QUOTA MATH (corrected 2026-10-11) and the loop's rule: it must NEVER read more
# often than every 10 minutes. Counting what a long June day really spends:
# the 3 Boca FEED cams are scored every tick (3 x 85-89 ticks = 255-267 calls),
# the 4 courier-fed surface cams only when the courier has a new frame (every ~3
# h, about 20 calls), and the underwater read about hourly (about 15): roughly
# 280-300 vision calls on the longest day, fewer in winter. That is ABOVE the
# first Gemini model's ~250/day free cap, so the chain carries the rest. The
# default provider order (VISION_PROVIDERS in scripts/cam_seaweed.py) is
# gemini-2.5-flash, then gemini-2.5-flash-lite (a separate daily bucket), then
# [only when CLEF_FALLBACK=1 is set below: Clef 27B on Cloudflare Workers AI (our
# own POST /api/vision/clef route, the same INGEST_TOKEN as the archive, capped
# at 600 calls a UTC day on the server; the image is shrunk to 768 px / q60 with
# Pillow first)], then
# Groq (large free allowance), then OpenRouter (rate-limited free model). GitHub
# Models is NOT in the default order (it is being retired); the GITHUB_TOKEN env
# and `models: read` below only matter if VISION_PROVIDERS adds "github". Each
# tick prints one "vision calls this tick: ..." line, counting attempts per
# provider/model, so a quota running out shows in the run log. The loop enforces
# the 10-minute rule by sleeping to
# the next :00/:10/:20... wall-clock boundary after each cycle (not a fixed
# "sleep 600"), so a slow cycle (retries/backoff) can never compound into
# faster-than-10-min reads.
#
# SAME-FRAME SKIP (2026-10-12): the Boca feed views refresh every ~10-30 min, so
# the 3 feed cams no longer spend a call on a still they already scored (see
# "SAME FEED FRAME" in scripts/cam_seaweed.py); the counts above are the ceiling.
#
# RUN WINDOW (2026-10-11): "daylight" is no longer a fixed clock window. The loop
# asks `python scripts/cam_seaweed.py --window-state` (see "run window" there):
# reading runs from the earliest sunrise - 30 min to the latest sunset + 30 min
# across the archived beaches, so the webcam archive covers the golden hour after
# a ~8:15 PM June sunset. That is ~14.8 h (89 ticks) at the longest (the call
# counts in the QUOTA MATH note above already assume it), and shorter every other
# day of the year.

on:
  schedule:
    # Once an hour, at :07, from 10:07 to 00:07 UTC (6:07 AM-8:07 PM EDT). This
    # is only a RECOVERY: the handoff job below is the primary scheduler, and
    # each loop already idles through the night, so a healthy chain never needs
    # the cron. A scheduled run must NEVER disturb a healthy loop (2026-10-11:
    # one cancelled a good loop at 22:47Z, mid sunset window — see the
    # `concurrency` block and the "guard" step below). At most one an hour is
    # plenty to restart a chain that broke, and a restart costs at most one
    # skipped grid slot. A loop started at 10:07 UTC is awake before the earliest
    # reading window opens (about 09:56 UTC in June, 11:35 UTC in December) and
    # idles until it does; hour 0 lets a recovery loop start after the longest
    # summer sunset-plus-30 (about 8:46 PM EDT = 00:46 UTC) for the dusk read.
    - cron: "7 10-23,0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sargassum.yml"
      - "scripts/cam_seaweed.py"
  workflow_dispatch: {}

permissions:
  contents: write
  models: read # lets the job's GITHUB_TOKEN call GitHub Models (only if VISION_PROVIDERS adds "github")
  actions: read # the scheduled-run guard step lists this workflow's other runs (read only)

# One run at a time, and a run that is NOT a scheduled recovery replaces the
# running loop, exactly as before:
#  - push / workflow_dispatch (the handoff job's `gh workflow run` is a
#    workflow_dispatch, so it is this case too): cancel-in-progress is true. The
#    new run cancels the running loop AND any pending run, and starts at once.
#    That is the point: two loops started by overlapping runs would each read
#    every ~10 min, DOUBLING vision spend and blowing the quota math above.
#  - schedule (the hourly recovery cron): cancel-in-progress is FALSE. GitHub
#    reads that setting from the INCOMING run, and cancels the running loop the
#    instant the new run is queued, before any step of it can run. So a guard
#    step alone cannot protect a healthy loop; the concurrency must not cancel
#    it. With false, a scheduled run waits PENDING behind the loop (it does not
#    start, so it spends nothing) and then has three outcomes:
#      * the loop ends normally: its handoff dispatches the successor
#        (cancel-in-progress true), which cancels the pending scheduled run;
#      * the loop dies with no handoff: the group frees and the pending
#        scheduled run starts, which is the recovery the cron exists for;
#      * a second scheduled run arrives first: GitHub keeps one pending run per
#        group and cancels the older pending one, so scheduled runs never pile
#        up, however long the loop lives.
#    Same group name for all events, on purpose: a separate group for the cron
#    would let a recovery loop and a dispatched loop run side by side.
# Expression support: `concurrency.cancel-in-progress` accepts expressions, and
# the workflow-level `concurrency` may use the github, inputs and vars contexts.
concurrency:
  group: sargassum
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build-feed:
    outputs:
      started: ${{ steps.t0.outputs.started }}
    runs-on: ubuntu-latest
    # Long-running loop job now, not a single read. GitHub's hard cap on a job
    # is 360 min (6h); 350 leaves headroom for the runner's own setup/teardown.
    timeout-minutes: 350
    steps:
      # Belt and braces for the hourly recovery cron (the `concurrency` block
      # above is the real protection; this covers a race or a later edit of it).
      # A SCHEDULED run that finds any other run of this workflow in progress or
      # queued ends here, successfully, without reading. It must also leave
      # `started` unset (t0 below is gated on it): the handoff job treats an
      # unset `started` as "no loop ran" and dispatches NOTHING. A skipped
      # recovery that dispatched a successor would cancel the healthy loop it
      # just stood aside for. Fails open: if the API call fails the run
      # continues as a normal loop, and the concurrency block still holds.
      - id: guard
        name: Scheduled recovery - stand aside if another loop is running
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          others=""
          for status in in_progress queued; do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sargassum.yml \
                    --status "$status" --limit 50 --json databaseId \
                    --jq ".[].databaseId | select(. != ${THIS_RUN})") || {
              echo "::warning::could not list '$status' runs — continuing as a normal loop"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            others="$others $ids"
          done
          others=$(echo "$others" | xargs) # trim
          if [ -n "$others" ]; then
            echo "another sargassum run is already live (run id(s): $others) — scheduled recovery stands aside, no read, no handoff"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no other run live — this scheduled run becomes the loop"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: t0
        name: Note when this loop started (the handoff job's fast-exit guard)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ steps.guard.outputs.skip != 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"

      - name: Install yt-dlp (underwater sea-cam frame grab) and Pillow (Clef image shrink)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        # yt-dlp resolves the Deerfield underwater YouTube livestream to an HLS
        # URL that ffmpeg (preinstalled on ubuntu-latest, as is node — the JS
        # runtime yt-dlp needs) frame-grabs. `|| true` keeps the job resilient:
        # the script fail-softs if yt-dlp is missing, so a failed install must
        # never fail the workflow — we just accrue no underwater readings. Pillow
        # shrinks the frame for the Clef fallback reader; without it the script
        # shrinks with ffmpeg instead, so a failed install costs nothing but a
        # slightly different JPEG encoder.
        run: pip install --quiet yt-dlp pillow || true

      - name: Read + publish cam vision on a ~10-minute loop through daylight
        if: ${{ steps.guard.outputs.skip != 'true' }}
        # Loop pattern per lightning.yml (see that file's header for the full
        # rationale): each cycle runs the one-shot script, publishes its output
        # to the sargassum-data branch, then sleeps to the next 10-min
        # wall-clock boundary so cadence stays ~10 min regardless of how long
        # the cycle itself took (API retries, backoff, courier fetch, etc).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # optional free fallback (14.4k/day)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # optional free fallback
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only used if VISION_PROVIDERS adds "github" (off by default)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the publish push below
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }} # webcam archive POSTs (scripts/cam_seaweed.py archive_frame)
          # Rollout canary: Clef stays OUT of the default provider order until the
          # route is deployed and smoke-tested (node scripts/clef_route_smoke.mjs
          # <archived r2_key>). Then uncomment this line to put it behind Gemini.
          # CLEF_FALLBACK: "1"
          # One file per beach (cam_seaweed.<slug>.json) lands here, driven by
          # config/vision-cams.json — see scripts/cam_seaweed.py. CAM_SEAWEED_OUT
          # (the legacy single-file copy for boca-raton, kept for one release)
          # is placed in the SAME directory so one glob picks up every file.
          CAM_SEAWEED_OUT_DIR: ${{ runner.temp }}/vision
          CAM_SEAWEED_OUT: ${{ runner.temp }}/vision/cam_seaweed.json
        run: |
          set +e # one bad cycle (vision API down, publish push conflict, ...) must not kill the loop
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="${RUNNER_TEMP}/pub"
          feed_dir="${CAM_SEAWEED_OUT_DIR}"
          budget_min=340 # leaves ~10 min headroom under the 350 timeout-minutes above

          # Seconds until the next :00/:10/:20... wall-clock boundary. Relies on
          # America/New_York (and UTC) using whole-hour offsets, so a UTC epoch
          # mod 600 lines up with local 10-minute boundaries too — no TZ math
          # needed here for the sleep itself (only the daylight check below
          # needs the actual local clock).
          sleep_to_boundary() {
            local now rem
            now=$(date +%s)
            rem=$(( now % 600 ))
            # Always a strictly FUTURE boundary (never 0): no two passes can
            # share a grid point, and an idle night pass can't spin.
            echo $(( 600 - rem ))
          }

          # Where we are in today's reading window, from the script itself:
          #   day   = earliest sunrise - 30 min to latest sunset + 30 min across
          #           the archived beaches (summer sunset ~8:15 PM EDT, so this
          #           runs to ~8:45 PM; winter ~6:00 PM EST);
          #   dusk  = the 20 min after that, for a loop that STARTS then;
          #   night = otherwise.
          # If the script cannot say (it prints "unknown" or fails), fall back
          # to a fixed America/New_York clock window that is wide enough for
          # the longest June day: day 05:55-20:50, dusk 20:51-21:10.
          window_state() {
            local state hm hm10
            state=$(python scripts/cam_seaweed.py --window-state 2>/dev/null | tail -n 1)
            case "$state" in
              day|dusk|night) echo "$state"; return 0 ;;
            esac
            hm=$(TZ="America/New_York" date +%H%M)
            hm10=$((10#$hm)) # force base-10: a leading zero would read as octal
            if [ "$hm10" -ge 555 ] && [ "$hm10" -le 2050 ]; then echo day
            elif [ "$hm10" -ge 2051 ] && [ "$hm10" -le 2110 ]; then echo dusk
            else echo night; fi
          }

          in_daylight() {
            [ "$(window_state)" = "day" ]
          }

          publish() {
            # One file per beach, plus the legacy single-file copy — every
            # cam_seaweed*.json the Python job wrote this cycle (see its
            # per-beach carry-forward: a beach with no prior data AND no fresh
            # capture this cycle simply has no file, same as before).
            local files=("$feed_dir"/cam_seaweed*.json)
            [ -e "${files[0]}" ] || { echo "  no feed written this cycle — leaving last good sargassum-data in place"; return 0; }
            rm -rf "$work"; mkdir -p "$work"
            cp "${files[@]}" "$work/" || return 1
            cd "$work" || return 1
            git init -q
            git config user.name "cam-vision-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -q -b sargassum-data
            git add -A
            git commit -q -m "Cam vision feed $(date -u +%FT%TZ)"
            # Force-push a single-commit orphan branch so history never grows.
            git push -f "$remote" sargassum-data
            cd - >/dev/null
          }

          # True in the first ~20 min after the reading window closes — a
          # loop that STARTS then (the previous one's shift ended right at
          # dusk) still owes the one dusk read below.
          just_after_dusk() {
            [ "$(window_state)" = "dusk" ]
          }

          consecutive_fail=0
          start_epoch=$(date +%s)
          did_day=0 # this loop has read in daylight since the last dusk read
          first=1   # first pass of this loop

          # Every read — this run's FIRST one too — lands on the :00/:10/:20…
          # grid. A restart (a cron/push cancel, or the handoff below) then can
          # never read twice within 10 min of the run it replaced: both runs
          # read only on the same grid, and a new run spends minutes on setup
          # before its first grid point, by which time the old one is gone.
          # Costs at most one skipped slot per restart. Keeps the quota math.
          sleep "$(sleep_to_boundary)"

          run_cycle() {
            rm -rf "$feed_dir"; mkdir -p "$feed_dir"
            if python scripts/cam_seaweed.py; then
              consecutive_fail=0
              publish && echo "  published $(date -u +%FT%TZ)"
            else
              consecutive_fail=$((consecutive_fail + 1))
              echo "  cycle failed (${consecutive_fail} in a row) — will retry next cycle"
            fi
          }

          while true; do
            elapsed_min=$(( ($(date +%s) - start_epoch) / 60 ))
            if [ "$elapsed_min" -ge "$budget_min" ]; then
              echo "time budget exhausted after ${elapsed_min}m — exiting loop (the handoff job starts the next one)"
              break
            fi

            if ! in_daylight; then
              # Night: idle instead of exiting, so this loop (or the successor
              # the handoff job starts) is already awake for the first morning
              # read. Exiting here left that read to GitHub's cron, which landed
              # 4-5 h late on Sep 26-28 2026. One read right at dusk still
              # publishes the night carry-forward; no other reads until morning.
              if [ "$did_day" -eq 1 ] || { [ "$first" -eq 1 ] && just_after_dusk; }; then
                echo "outside the reading window (sunrise-30 min to sunset+30 min) — one final read for the night carry-forward, then idling until morning"
                run_cycle
                if [ "$consecutive_fail" -ge 5 ]; then
                  echo "5 consecutive cycle failures (last one the dusk read) — bailing so this shows as a red run"
                  exit 1
                fi
              fi
              did_day=0
              first=0
              sleep "$(sleep_to_boundary)"
              continue
            fi

            did_day=1
            first=0
            run_cycle

            if [ "$consecutive_fail" -ge 5 ]; then
              echo "5 consecutive cycle failures — bailing so this shows as a red run (persistent breakage, not transient)"
              exit 1
            fi

            sleep "$(sleep_to_boundary)"
          done

  # Starts the next loop the moment this one ends. GitHub's cron is best-effort:
  # Sep 24-28 2026 it left loops unrestarted for hours (lightning 109 min,
  # goes-cloud and the cam feed 4-5 h late every morning), so each loop relays
  # to its own successor. GITHUB_TOKEN may trigger workflow_dispatch (the one
  # event it is allowed to start), so this needs no secret. `actions: write`
  # lives on this small job only, never on the job that runs the feed scripts.
  # The cron above stays as the fallback if a run dies before reaching here.
  #  - Not after a cancel: with cancel-in-progress, a cancelled loop was
  #    already replaced by a newer run; dispatching again would ping-pong.
  #  - Not after a loop that ended within 15 min (setup broke, or a logic
  #    bug): no tight respawn cycle; the cron retries that instead.
  #  - Not after a scheduled recovery that stood aside for a live loop (the
  #    guard step above): it never sets `started`, so this job dispatches
  #    nothing and the healthy loop is not cancelled.
  #  - Only from main, so a branch test run never starts a chain.
  handoff:
    needs: build-feed
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next loop
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build-feed.result }}
          STARTED: ${{ needs.build-feed.outputs.started }}
        run: |
          if [ -z "$STARTED" ]; then
            echo "build-feed never recorded its start ('${RESULT}') — not respawning; the cron retries it"
            exit 0
          fi
          ran=$(( $(date +%s) - STARTED ))
          if [ "$ran" -lt 900 ]; then
            echo "build-feed ended '${RESULT}' after only ${ran}s — not a normal shift end, so no respawn; the cron retries it"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run sargassum.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "next loop dispatched (build-feed ended '${RESULT}' after ${ran}s)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not dispatch the next loop — the cron is the only fallback now"
          exit 1
