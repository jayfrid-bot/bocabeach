name: GOES Cloud Feed

# Builds a small goes_cloud.json of SATELLITE-OBSERVED cloud cover per beach
# (NOAA GOES-19 ABI Clear Sky Mask) and publishes it to the `cloud-data`
# branch (NOT main), mirroring lightning.yml — the netCDF/pixel work runs here
# on free public-repo Actions minutes and never touches the Netlify build/bill.
# The web app reads the published file via raw.githubusercontent.com
# (lib/sources/goesCloud.ts).
#
# GitHub's cron is a promise of "no more often than", NOT "will fire on time":
# a plain `*/15` schedule was throttled to only ~4-5 REAL fires/day (same
# throttling proven for sargassum.yml — see that file's header for the full
# write-up and the measured fire times). One read-and-exit per fire left this
# feed hours stale (202 min stale at 2 PM measured once), which fed a wrong
# fallback into the sand-temperature model and under-read ground truth by
# 21degF. So — same fix as sargassum.yml and lightning.yml — each fire does
# NOT read once and exit. It loops INSIDE the job on its own ~15-minute
# wall-clock cadence (reading only in daylight, idling overnight) for up to
# ~340 min of job time, then the `handoff` job dispatches the next loop. The
# cron alone never kept the loops going: Sep 24-28 2026 the morning loop
# started 4-5 h late, so the handoff (not the cron) is what keeps it live.
#
# CADENCE MATH is unchanged by this fix and MUST be respected by the loop:
# the ACMC cloud-mask product itself only updates on a ~5-min cadence, so
# there is no value (and only NOAA S3 anonymous-fetch quota cost) in reading
# faster than every 15 min. The loop enforces this by sleeping to the next
# :00/:15/:30/:45 wall-clock boundary after each cycle (not a fixed
# "sleep 900"), so a slow cycle (retries/backoff) can never compound into
# faster-than-15-min reads.

on:
  schedule:
    # Every 15 minutes, around the clock. GitHub throttles this to only a
    # handful of real fires/day (see header) — the in-job loop below is what
    # actually delivers the ~15-min cadence; the cron here just makes sure a
    # loop gets (re)started periodically even if push/dispatch don't.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/goes-cloud.yml", "scripts/goes_cloud.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: goes-cloud
  # A new cron fire cancels any healthy running loop and starts a fresh one.
  # That's fine, not wasteful: the fresh loop just resumes the same ~15-min
  # cadence, so the feed cadence is unaffected. Keeping this true is what
  # makes the fix quota-safe — without it, two loops started by overlapping
  # throttled fires would each read every ~15 min, doubling NOAA S3 fetch
  # volume for no benefit.
  cancel-in-progress: true

jobs:
  build-feed:
    outputs:
      started: ${{ steps.t0.outputs.started }}
    runs-on: ubuntu-latest
    # Long-running loop job now, not a single read. GitHub's hard cap on a
    # job is 360 min (6h); 350 leaves headroom for the runner's own
    # setup/teardown.
    timeout-minutes: 350
    steps:
      - id: t0
        name: Note when this loop started (the handoff job's fast-exit guard)
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout (for the script + beach config)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet --disable-pip-version-check h5py numpy

      - name: Build + publish cloud feed on a ~15-minute loop through daylight
        # Loop pattern per sargassum.yml/lightning.yml (see sargassum.yml's
        # header for the full rationale): each cycle runs the one-shot
        # script, publishes its output to the cloud-data branch, then sleeps
        # to the next 15-min wall-clock boundary so cadence stays ~15 min
        # regardless of how long the cycle itself took (S3 retries, etc).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOES_OUT: ${{ runner.temp }}/goes_cloud.json
        run: |
          set +e # one bad cycle (S3 hiccup, publish push conflict, ...) must not kill the loop
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="${RUNNER_TEMP}/pub"
          feed="${GOES_OUT}"
          budget_min=340 # leaves ~10 min headroom under the 350 timeout-minutes above

          # Seconds until the next :00/:15/:30/:45 wall-clock boundary. Relies
          # on America/New_York (and UTC) using whole-hour offsets, so a UTC
          # epoch mod 900 lines up with local 15-minute boundaries too — no TZ
          # math needed here for the sleep itself (only the daylight check
          # below needs the actual local clock).
          sleep_to_boundary() {
            local now rem
            now=$(date +%s)
            rem=$(( now % 900 ))
            # Always a strictly FUTURE boundary (never 0): no two passes can
            # share a grid point, and an idle night pass can't spin.
            echo $(( 900 - rem ))
          }

          # True while local (America/New_York) time is inside the daylight
          # window GOES cloud cover cares about for the sand model + sky
          # score. A bit later than the cam feed's window: sunset-color
          # scoring wants the evening granules too.
          in_daylight() {
            local hm hm10
            hm=$(TZ="America/New_York" date +%H%M)
            hm10=$((10#$hm)) # force base-10: a leading zero would read as octal
            [ "$hm10" -ge 555 ] && [ "$hm10" -le 2035 ]
          }

          publish() {
            [ -f "$feed" ] || { echo "  no feed written this cycle — leaving last good cloud-data in place"; return 0; }
            rm -rf "$work"; mkdir -p "$work"
            cp "$feed" "$work/goes_cloud.json" || return 1
            cd "$work" || return 1
            git init -q
            git config user.name "goes-cloud-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -q -b cloud-data
            git add goes_cloud.json
            git commit -q -m "GOES-19 cloud feed $(date -u +%FT%TZ)"
            # Force-push a single-commit orphan branch so history never grows.
            git push -f "$remote" cloud-data
            cd - >/dev/null
          }

          # True in the first ~20 min after the daylight window closes — a
          # loop that STARTS then (the previous one's shift ended right at
          # dusk) still owes the one dusk read below.
          just_after_dusk() {
            local hm hm10
            hm=$(TZ="America/New_York" date +%H%M)
            hm10=$((10#$hm))
            [ "$hm10" -ge 2036 ] && [ "$hm10" -le 2055 ]
          }

          consecutive_fail=0
          start_epoch=$(date +%s)
          did_day=0 # this loop has read in daylight since the last dusk read
          first=1   # first pass of this loop

          run_cycle() {
            rm -f "$feed"
            if python scripts/goes_cloud.py; then
              consecutive_fail=0
              publish && echo "  published $(date -u +%FT%TZ)"
            else
              consecutive_fail=$((consecutive_fail + 1))
              echo "  cycle failed (${consecutive_fail} in a row) — will retry next cycle"
            fi
          }

          while true; do
            elapsed_min=$(( ($(date +%s) - start_epoch) / 60 ))
            if [ "$elapsed_min" -ge "$budget_min" ]; then
              echo "time budget exhausted after ${elapsed_min}m — exiting loop (the handoff job starts the next one)"
              break
            fi

            if ! in_daylight; then
              # Night: idle instead of exiting, so this loop (or the successor
              # the handoff job starts) is already awake for the first morning
              # read. Exiting here left that read to GitHub's cron, which landed
              # 4-5 h late on Sep 26-28 2026. One read right at dusk still
              # publishes the night carry-forward; no other reads until morning.
              if [ "$did_day" -eq 1 ] || { [ "$first" -eq 1 ] && just_after_dusk; }; then
                echo "outside daylight window (05:55-20:35 America/New_York) — one final read for the night carry-forward, then idling until morning"
                run_cycle
                if [ "$consecutive_fail" -ge 5 ]; then
                  echo "5 consecutive cycle failures (last one the dusk read) — bailing so this shows as a red run"
                  exit 1
                fi
              fi
              did_day=0
              first=0
              sleep "$(sleep_to_boundary)"
              continue
            fi

            did_day=1
            first=0
            run_cycle

            if [ "$consecutive_fail" -ge 5 ]; then
              echo "5 consecutive cycle failures — bailing so this shows as a red run (persistent breakage, not transient)"
              exit 1
            fi

            sleep "$(sleep_to_boundary)"
          done

  # Starts the next loop the moment this one ends. GitHub's cron is best-effort:
  # Sep 24-28 2026 it left loops unrestarted for hours (lightning 109 min,
  # goes-cloud and the cam feed 4-5 h late every morning), so each loop relays
  # to its own successor. GITHUB_TOKEN may trigger workflow_dispatch (the one
  # event it is allowed to start), so this needs no secret. `actions: write`
  # lives on this small job only, never on the job that runs the feed scripts.
  # The cron above stays as the fallback if a run dies before reaching here.
  #  - Not after a cancel: with cancel-in-progress, a cancelled loop was
  #    already replaced by a newer run; dispatching again would ping-pong.
  #  - Not after a loop that ended within 15 min (setup broke, or a logic
  #    bug): no tight respawn cycle; the cron retries that instead.
  #  - Only from main, so a branch test run never starts a chain.
  handoff:
    needs: build-feed
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next loop
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build-feed.result }}
          STARTED: ${{ needs.build-feed.outputs.started }}
        run: |
          if [ -z "$STARTED" ]; then
            echo "build-feed never recorded its start ('${RESULT}') — not respawning; the cron retries it"
            exit 0
          fi
          ran=$(( $(date +%s) - STARTED ))
          if [ "$ran" -lt 900 ]; then
            echo "build-feed ended '${RESULT}' after only ${ran}s — not a normal shift end, so no respawn; the cron retries it"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run goes-cloud.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "next loop dispatched (build-feed ended '${RESULT}' after ${ran}s)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not dispatch the next loop — the cron is the only fallback now"
          exit 1
